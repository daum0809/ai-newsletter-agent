name: academy-weekly

on:
  schedule:
    - cron: '0 0 * * 5'  # UTC 금 00:00 = KST 금요일 09:00 (지연될 수 있음)
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1이면 노션 초안을 만들지 않고 내용만 출력'
        default: '1'
      hours:
        description: '최근 몇 시간의 글을 수집할지 (168 = 1주)'
        default: '168'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run.py --academy --hours "${{ github.event.inputs.hours || '168' }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # 초안이 준비되면 내 Discord로 알림
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # 예약 실행은 초안 생성, 수동 실행은 입력값(기본 1 = 시험)
          DRY_RUN: ${{ github.event_name == 'schedule' && '0' || github.event.inputs.dry_run }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: academy-log-${{ github.run_id }}
          path: logs/
          retention-days: 30
